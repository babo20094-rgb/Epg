name: Diagnose Moja webTV API

on:
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright@1.47.0
          npx playwright install --with-deps chromium

      - name: Capture network requests to mojawebtv.bhtelecom.ba
        run: |
          cat > capture.js << 'EOF'
          const { chromium } = require('playwright');

          (async () => {
            const calls = [];
            const browser = await chromium.launch();
            const page = await browser.newPage();

            page.on('request', (req) => {
              const url = req.url();
              if (url.includes('bhtelecom.ba')) {
                calls.push({
                  type: 'request',
                  url,
                  method: req.method(),
                  headers: req.headers(),
                  postData: req.postData(),
                });
              }
            });

            page.on('response', async (res) => {
              const url = res.url();
              if (url.includes('bhtelecom.ba')) {
                let bodySnippet = null;
                try {
                  const body = await res.text();
                  bodySnippet = body.slice(0, 4000);
                } catch (e) {
                  bodySnippet = `<error reading body: ${e.message}>`;
                }
                calls.push({
                  type: 'response',
                  url,
                  status: res.status(),
                  headers: res.headers(),
                  bodySnippet,
                });
              }
            });

            try {
              await page.setViewportSize({ width: 1600, height: 1000 });
              await page.goto('https://mojawebtv.bhtelecom.ba/', { waitUntil: 'load', timeout: 60000 });
              await page.waitForTimeout(6000);

              // click on a placeholder channel to open its detail/EPG view
              // try a few likely channel anchors (hash-based routing seen in the page: #<id>)
              const kandidaten = ['#bhtv1', '#bht1', '#arenasport1', '#atv', '#k3', '#rtrs', '#obn', '#ftv'];
              for (const hash of kandidaten) {
                try {
                  await page.goto('https://mojawebtv.bhtelecom.ba/' + hash, { waitUntil: 'load', timeout: 15000 });
                  await page.waitForTimeout(3000);
                } catch (e) {}
              }

              // also try clicking visible channel thumbnails/links directly
              const links = await page.locator('.chanitem a').all();
              for (const link of links.slice(0, 15)) {
                try {
                  await link.click({ timeout: 3000 });
                  await page.waitForTimeout(1500);
                } catch (e) {}
              }

              // look for and click any "program guide" / "raspored" / "epg" tab or button
              const epgButtons = await page.locator('a, button').filter({ hasText: /raspored|program|epg|vodic|vodič/i }).all();
              for (const btn of epgButtons.slice(0, 5)) {
                try {
                  await btn.click({ timeout: 3000 });
                  await page.waitForTimeout(3000);
                } catch (e) {}
              }
            } catch (e) {
              calls.push({ type: 'error', message: e.message });
            }

            await browser.close();

            require('fs').writeFileSync('captured_calls.json', JSON.stringify(calls, null, 2));
            console.log(`Captured ${calls.length} entries`);
          })();
          EOF
          node capture.js

      - name: Upload captured calls
        uses: actions/upload-artifact@v4
        with:
          name: mojawebtv-captured-calls
          path: captured_calls.json
          retention-days: 14
