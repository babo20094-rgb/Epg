name: Diagnose Moja webTV API

on:
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright@1.47.0
          npx playwright install --with-deps chromium

      - name: Capture network requests to mojawebtv.bhtelecom.ba (Sender-Detailseite + Kalender)
        run: |
          cat > capture.js << 'EOF'
          const { chromium } = require('playwright');

          (async () => {
            const calls = [];
            const browser = await chromium.launch();
            const page = await browser.newPage();

            page.on('request', (req) => {
              const url = req.url();
              if (url.includes('bhtelecom.ba')) {
                calls.push({
                  type: 'request',
                  url,
                  method: req.method(),
                  headers: req.headers(),
                  postData: req.postData(),
                });
              }
            });

            page.on('response', async (res) => {
              const url = res.url();
              if (url.includes('bhtelecom.ba')) {
                let bodySnippet = null;
                try {
                  const body = await res.text();
                  bodySnippet = body.slice(0, 6000);
                } catch (e) {
                  bodySnippet = `<error reading body: ${e.message}>`;
                }
                calls.push({
                  type: 'response',
                  url,
                  status: res.status(),
                  headers: res.headers(),
                  bodySnippet,
                });
              }
            });

            try {
              await page.setViewportSize({ width: 1600, height: 1000 });
              await page.goto('https://mojawebtv.bhtelecom.ba/', { waitUntil: 'load', timeout: 60000 });
              await page.waitForTimeout(5000);

              // Klick auf den Kanal-NAMEN/Titel (nicht das Thumbnail, das startet nur den Stream) -
              // versucht mehrere plausible Klick-Ziele fuer den ersten Kanal mit echtem EPG (BHT 1, epgid=48).
              const kanalSelectors = [
                'a[title="BHT 1"]',
                'div.chanitem >> text=BHT 1',
                '#ch2 a',
                '#ch2',
              ];
              let navigiert = false;
              for (const sel of kanalSelectors) {
                try {
                  const loc = page.locator(sel).first();
                  if (await loc.count() > 0) {
                    await loc.click({ timeout: 5000 });
                    await page.waitForTimeout(4000);
                    navigiert = true;
                    break;
                  }
                } catch (e) {}
              }
              calls.push({ type: 'debug', message: `Kanal-Klick navigiert=${navigiert}, aktuelle URL=${page.url()}` });

              // Nach einem Kalender-Widget / "naechster Tag"-Pfeil suchen und mehrfach klicken
              const kalenderSelectors = [
                '.calendar', '.datepicker', '[class*="calendar"]', '[class*="date"]',
                'a[title*="Sljede" i]', 'a[title*="next" i]', 'button[title*="next" i]',
                '.fa-chevron-right', '.fa-angle-right', '.next', '[class*="arrow-right"]',
              ];
              for (const sel of kalenderSelectors) {
                try {
                  const els = await page.locator(sel).all();
                  calls.push({ type: 'debug', message: `Selector ${sel}: ${els.length} Treffer` });
                } catch (e) {}
              }

              // Versuche bis zu 5x auf irgendein Element mit Pfeil-Symbol/"weiter" zu klicken
              for (let i = 0; i < 5; i++) {
                let geklickt = false;
                for (const sel of kalenderSelectors) {
                  try {
                    const loc = page.locator(sel).first();
                    if (await loc.count() > 0 && await loc.isVisible()) {
                      await loc.click({ timeout: 3000 });
                      await page.waitForTimeout(2500);
                      geklickt = true;
                      break;
                    }
                  } catch (e) {}
                }
                if (!geklickt) break;
              }

              // Zusaetzlich: kompletten sichtbaren Text der Seite nach Navigation speichern (fuer Struktur-Analyse)
              const bodyText = await page.evaluate(() => document.body.innerText.slice(0, 3000));
              calls.push({ type: 'debug', message: `Body-Text-Ausschnitt: ${bodyText}` });
              const bodyHtml = await page.content();
              require('fs').writeFileSync('detail_page.html', bodyHtml);
            } catch (e) {
              calls.push({ type: 'error', message: e.message });
            }

            await browser.close();

            require('fs').writeFileSync('captured_calls.json', JSON.stringify(calls, null, 2));
            console.log(`Captured ${calls.length} entries`);
          })();
          EOF
          node capture.js

      - name: Upload captured calls
        uses: actions/upload-artifact@v4
        with:
          name: mojawebtv-captured-calls
          path: |
            captured_calls.json
            detail_page.html
          retention-days: 14
