name: Diagnose MagentaTV MK API

on:
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright@1.47.0
          npx playwright install --with-deps chromium

      - name: Capture network requests to magentatv.mk EPG page
        run: |
          cat > capture.js << 'EOF'
          const { chromium } = require('playwright');

          (async () => {
            const calls = [];
            const browser = await chromium.launch();
            const page = await browser.newPage();

            page.on('request', (req) => {
              const url = req.url();
              if (url.includes('yo-digital.com') || url.includes('tv3cloud.com')) {
                calls.push({
                  type: 'request',
                  url,
                  method: req.method(),
                  headers: req.headers(),
                  postData: req.postData(),
                });
              }
            });

            page.on('response', async (res) => {
              const url = res.url();
              if (url.includes('yo-digital.com') || url.includes('tv3cloud.com')) {
                let bodySnippet = null;
                try {
                  const body = await res.text();
                  bodySnippet = body.slice(0, 4000);
                } catch (e) {
                  bodySnippet = `<error reading body: ${e.message}>`;
                }
                calls.push({
                  type: 'response',
                  url,
                  status: res.status(),
                  headers: res.headers(),
                  bodySnippet,
                });
              }
            });

            try {
              await page.setViewportSize({ width: 1600, height: 1000 });
              await page.goto('https://www.magentatv.mk/epg', { waitUntil: 'load', timeout: 60000 });
              await page.waitForTimeout(10000);

              // scroll the page itself in case the EPG grid only mounts once visible
              await page.mouse.wheel(0, 1500);
              await page.waitForTimeout(4000);

              // try clicking a "jump to now" / time button to force the grid to render
              const jumpButtons = await page.locator('button, a').filter({ hasText: /Сега|Now/i }).all();
              for (const btn of jumpButtons) {
                try { await btn.click({ timeout: 3000 }); } catch (e) {}
              }
              await page.waitForTimeout(4000);

              // scroll horizontally inside the EPG grid container itself (mouse wheel with shift = horizontal in most browsers)
              await page.mouse.move(800, 500);
              await page.mouse.wheel(2000, 0);
              await page.waitForTimeout(4000);
              await page.mouse.wheel(2000, 0);
              await page.waitForTimeout(4000);

              // scroll the channel picker column vertically too
              await page.mouse.move(100, 500);
              await page.mouse.wheel(0, 3000);
              await page.waitForTimeout(4000);
              await page.mouse.wheel(0, 3000);
              await page.waitForTimeout(4000);
            } catch (e) {
              calls.push({ type: 'error', message: e.message });
            }

            await browser.close();

            require('fs').writeFileSync('captured_calls.json', JSON.stringify(calls, null, 2));
            console.log(`Captured ${calls.length} entries`);
          })();
          EOF
          node capture.js

      - name: Upload captured calls
        uses: actions/upload-artifact@v4
        with:
          name: magentatv-captured-calls
          path: captured_calls.json
          retention-days: 14
