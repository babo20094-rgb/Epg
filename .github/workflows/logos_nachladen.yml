name: Blockierte Logos nachladen

# Einmaliger/manueller Workflow (kein Cron) - laedt alle Logo-URLs, die
# auf den vom Entwickler-Sandbox aus nicht erreichbaren Picon-Host
# (103.176.90.95 / 51.158.145.100) zeigen, herunter, optimiert sie und
# hostet sie selbst unter logos/blockiert_nachgeladen/. sender.txt wird
# dabei auf die neuen raw.githubusercontent.com-URLs umgestellt.
#
# Bewusst getrennt vom regulaeren update_epg.yml, damit er nicht
# versehentlich automatisch mitlaeuft - nur per Hand ("Run workflow")
# auszuloesen.

on:
  workflow_dispatch:

jobs:
  logos-nachladen:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install Pillow

      - name: Blockierte Logos nachladen
        run: |
          python logos_bei_bedarf/lade_blockierte_logos.py

      - name: Commit Ergebnis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add sender.txt logos/blockiert_nachgeladen/

          if git diff --cached --quiet; then
            echo "Keine Änderungen."
            exit 0
          fi

          git commit -m "Blockierte Logos heruntergeladen, optimiert und selbst gehostet"

          git pull --rebase origin main
          git push
