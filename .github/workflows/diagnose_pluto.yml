name: Diagnose Pluto

# Reine Messung: Muss Pluto TV in der DE-Kaskade bleiben? Schreibt NICHTS
# ins EPG und committet nichts - nur manuell startbar.
on:
  workflow_dispatch:

concurrency:
  group: diagnose-pluto
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Diagnose
        run: python scripts/diagnose_pluto.py

      - name: CSV als Artefakt hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnose-pluto
          path: diagnose_pluto.csv
          if-no-files-found: ignore
