name: Test Schlanke EPG

# Reiner Test, nur manuell startbar. Erzeugt die EPG mit eingeschaltetem
# Schlank-Modus (EPG_SCHLANK=1, siehe generate_epg.py) und legt die Datei
# Epg_schlank.xml.gz als EINEN Commit auf den eigenen Branch "test-schlank".
# main, Epg_365_Tage.xml.gz und die Player-URL bleiben unberuehrt.
#
# Test-URL fuer TiviMate:
# https://raw.githubusercontent.com/babo20094-rgb/Epg/test-schlank/Epg_schlank.xml.gz
on:
  workflow_dispatch:

permissions:
  contents: write

# Gleiche Gruppe wie "Update EPG": Der Anbieter erlaubt offenbar nur einen
# Playlist-Abruf zur Zeit, daher nie gleichzeitig mit dem echten Lauf.
concurrency:
  group: update-epg
  cancel-in-progress: false

jobs:
  schlank:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          python -m pytest test_generate_epg.py -v

      - name: Generate EPG (Schlank-Modus)
        env:
          PROVIDER: ${{ secrets.PROVIDER }}
          EPG_SCHLANK: "1"
        run: |
          python generate_epg.py

      - name: Auf Branch test-schlank legen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan test-schlank
          git rm -rf --cached . > /dev/null
          git add -f Epg_schlank.xml.gz
          git commit -m "Schlanke Test-EPG"
          git push --force origin test-schlank
