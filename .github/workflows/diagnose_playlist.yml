name: Diagnose Playlist Coverage

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python scripts/diagnose_playlist_coverage.py
        env:
          PROVIDER: ${{ secrets.PROVIDER }}
