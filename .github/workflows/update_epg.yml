name: Update EPG

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Update M3U
        env:
          IPTV_M3U_URL: ${{ secrets.IPTV_M3U_URL }}
        run: |
          python update_m3u.py

      - name: Generate EPG
        run: |
          python generate_epg.py

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git diff --cached --quiet || git commit -m "Daily EPG update"
          git push
