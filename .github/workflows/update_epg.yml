name: Update EPG

on:
  schedule:
    # Alle 8 Stunden (3x täglich), synchron zum TiviMate-EPG-
    # Aktualisierungsintervall - schont den externen EPG-Anbieter,
    # DYN-Live-Events kommen trotzdem 3x täglich aktuell rein.
    - cron: '0 */8 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate EPG
        run: |
          python generate_epg.py

      - name: Commit EPG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Epg_365_Tage.xml

          if git diff --cached --quiet; then
            echo "Keine Änderungen."
            exit 0
          fi

          git commit -m "Daily EPG update"
          git push
