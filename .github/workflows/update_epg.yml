name: Update EPG

on:
  schedule:
    # Alle 4 Stunden (6x täglich) - kürzeres Intervall als frueher (8h),
    # damit Live-Kanalname-Aenderungen (DYN PPV, Flo Racing, ...) nicht
    # mehrere Stunden veraltet im EPG-Raster stehen bleiben. Oeffentliches
    # Repo, daher keine GitHub-Actions-Minutenkosten durch die hoehere
    # Frequenz.
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          python -m pytest test_generate_epg.py -v

      - name: Generate EPG
        env:
          DYN_EPG_PROVIDER_URL: ${{ secrets.DYN_EPG_PROVIDER_URL }}
          DYN_EPG_PROVIDER_URL_EU: ${{ secrets.DYN_EPG_PROVIDER_URL_EU }}
          IPTV_M3U_PROVIDER_URL: ${{ secrets.IPTV_M3U_PROVIDER_URL }}
        run: |
          python generate_epg.py

      - name: Commit EPG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Epg_365_Tage.xml

          if git diff --cached --quiet; then
            echo "Keine Änderungen."
            exit 0
          fi

          git commit -m "Daily EPG update"

          # Vor dem Push den aktuellen Stand von main einholen und die
          # eigenen Commits obendrauf setzen (Rebase). Verhindert den
          # "rejected - fetch first"-Fehler, falls zwischen Checkout
          # und Push bereits ein anderer Commit (z.B. manueller Upload)
          # auf main gelandet ist. Bei echtem Merge-Konflikt (sehr
          # unwahrscheinlich, da nur Epg_365_Tage.xml committet wird)
          # bricht der Rebase ab und der Job schlägt sichtbar fehl,
          # statt fehlerhaft zu pushen.
          git pull --rebase origin main
          git push
