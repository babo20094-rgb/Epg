name: Update EPG

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Update M3U
        env:
          IPTV_M3U_URL: ${{ secrets.IPTV_M3U_URL }}
        run: |
          python update_m3u.py

      - name: Generate EPG
        run: |
          python generate_epg.py

      - name: Remove temporary files
        run: |
          rm -f original_playlist.m3u
          rm -f playlist_mit_tvgid.m3u

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .

          git restore --staged original_playlist.m3u 2>/dev/null || true
          git restore --staged playlist_mit_tvgid.m3u 2>/dev/null || true

          git diff --cached --quiet || git commit -m "Daily EPG update"

          git push
