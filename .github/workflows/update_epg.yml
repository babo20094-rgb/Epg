name: Update EPG

on:
  schedule:
    # Alle 8 Stunden (3x täglich), synchron zum TiviMate-EPG-
    # Aktualisierungsintervall - schont den externen EPG-Anbieter,
    # DYN-Live-Events kommen trotzdem 3x täglich aktuell rein.
    - cron: '0 */8 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          python -m pytest test_generate_epg.py -v

      - name: Generate EPG
        env:
          DYN_EPG_PROVIDER_URL: ${{ secrets.DYN_EPG_PROVIDER_URL }}
          DYN_EPG_PROVIDER_URL_EU: ${{ secrets.DYN_EPG_PROVIDER_URL_EU }}
        run: |
          python generate_epg.py

      - name: Debug - Anbieter-Dateien auf Clubber-Kanaele pruefen
        env:
          DYN_EPG_PROVIDER_URL: ${{ secrets.DYN_EPG_PROVIDER_URL }}
          DYN_EPG_PROVIDER_URL_EU: ${{ secrets.DYN_EPG_PROVIDER_URL_EU }}
        run: |
          python debug_clubber_check.py

      - name: Commit EPG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Epg_365_Tage.xml

          if git diff --cached --quiet; then
            echo "Keine Änderungen."
            exit 0
          fi

          git commit -m "Daily EPG update"

          # Vor dem Push den aktuellen Stand von main einholen und die
          # eigenen Commits obendrauf setzen (Rebase). Verhindert den
          # "rejected - fetch first"-Fehler, falls zwischen Checkout
          # und Push bereits ein anderer Commit (z.B. manueller Upload)
          # auf main gelandet ist. Bei echtem Merge-Konflikt (sehr
          # unwahrscheinlich, da nur Epg_365_Tage.xml committet wird)
          # bricht der Rebase ab und der Job schlägt sichtbar fehl,
          # statt fehlerhaft zu pushen.
          git pull --rebase origin main
          git push
