name: Test MagentaTV ME Quelle

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Debug - alle station_ids aus den Schedules-Antworten sammeln
        run: |
          python3 - <<'EOF'
          import sys
          sys.path.insert(0, ".")
          from quellen.magentatv_me_epg import _fenster_abrufen, _kanal_index_laden
          from datetime import datetime, timezone, timedelta

          index = _kanal_index_laden()
          print(f"Kanalliste: {len(index['name_index'])} Namen im Index")
          rtcg_id = index["name_index"].get("rtcg1")
          print("RTCG 1 station_id laut Kanalliste:", rtcg_id)

          heute = datetime.now(timezone.utc).date()
          alle_ids = set()
          for tag_offset in range(1):
              datum = heute + timedelta(days=tag_offset)
              for hour_offset in range(0, 24, 3):
                  kanaele = _fenster_abrufen(datum, hour_offset)
                  print(f"{datum} +{hour_offset}h: {len(kanaele)} Sender, ids={list(kanaele.keys())}")
                  alle_ids.update(kanaele.keys())

          print(f"\nInsgesamt {len(alle_ids)} unterschiedliche station_ids ueber alle Fenster gesehen.")
          print("RTCG 1 darunter?", rtcg_id in alle_ids)
          EOF

      - name: Test MagentaTV ME Quelle (kanal_finden + hole_programme)
        run: |
          python3 - <<'EOF'
          import sys
          sys.path.insert(0, ".")
          from quellen.magentatv_me_epg import (
              magentatv_me_kanal_finden,
              magentatv_me_hole_programme,
          )

          testsender = [
              ("MO", "RTCG 1"),
              ("MO", "PRVA"),
              ("MNG", "NOVA M"),
              ("MO", "VIJESTI"),
              ("MO", "ARENASPORT 1"),
          ]

          treffer = 0
          for land, sender in testsender:
              station_id = magentatv_me_kanal_finden(sender)
              print(f"{land} | {sender!r:20} -> station_id={station_id}")
              if station_id is None:
                  continue
              programme = magentatv_me_hole_programme(station_id, tage=1)
              print(f"    {len(programme)} Sendungen geladen")
              for p in programme[:3]:
                  print(f"    {p['start']} - {p['stop']}: {p['title']!r}")
              if programme:
                  treffer += 1

          print(f"\n{treffer} von {len(testsender)} Testsendern haben echte Sendungsdaten geliefert.")
          EOF
