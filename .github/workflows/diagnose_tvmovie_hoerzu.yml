name: Diagnose tvmovie-hoerzu

# Reine Messung: Koennen tvmovie.de/hoerzu.de durch epgshare01 ersetzt werden? Schreibt NICHTS
# ins EPG und committet nichts - nur manuell startbar.
on:
  workflow_dispatch:

concurrency:
  group: diagnose-tvmovie-hoerzu
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Diagnose
        run: python scripts/diagnose_tvmovie_hoerzu.py

      - name: CSV als Artefakt hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnose-tvmovie-hoerzu
          path: diagnose_tvmovie_hoerzu.csv
          if-no-files-found: ignore
