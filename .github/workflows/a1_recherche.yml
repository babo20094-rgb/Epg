name: A1 Kroatien EPG Recherche (temporär)

on:
  workflow_dispatch:

jobs:
  recherche:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: A1 Xplore TV erkunden
        run: |
          python - <<'EOF'
          import re
          import requests

          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
              "AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          }

          def zeige(url, **kwargs):
              print(f"\n=== {url} ===")
              try:
                  r = requests.get(url, headers=HEADERS, timeout=15, **kwargs)
                  print("Status:", r.status_code, "| Groesse:", len(r.content))
                  ct = r.headers.get("content-type", "")
                  print("Content-Type:", ct)
                  text = r.text
                  print(text[:1500])
                  return r
              except Exception as e:
                  print("FEHLER:", e)
                  return None

          # 1) Startseite - suchen nach eingebetteter API-Konfiguration/Next.js-Daten
          r = zeige("https://a1xploretv.hr/")
          if r is not None:
              for muster in [
                  r'"apiUrl"\s*:\s*"([^"]+)"',
                  r'"api_url"\s*:\s*"([^"]+)"',
                  r'"baseUrl"\s*:\s*"([^"]+)"',
                  r'apiBaseUrl["\']?\s*[:=]\s*["\']([^"\']+)',
                  r'https?://[a-z0-9.-]*a1xploretv[a-z0-9.-]*/api[^"\'\\s]*',
              ]:
                  treffer = re.findall(muster, r.text)
                  if treffer:
                      print("Gefundenes Muster:", muster, "->", treffer[:10])

          # 2) robots.txt / sitemap - oft Hinweise auf weitere Pfade
          zeige("https://a1xploretv.hr/robots.txt")
          zeige("https://a1xploretv.hr/sitemap.xml")

          # 3) Uebliche TV-Guide-Pfad-Kandidaten (Kroatisch: tv vodic/raspored)
          for pfad in [
              "tv-vodic",
              "tv-program",
              "program",
              "epg",
              "vodic",
          ]:
              zeige(f"https://a1xploretv.hr/{pfad}")

          # 4) Direkter CDN-Host aus den Bild-URLs im alten EPG-Dump
          zeige("https://cdn.a1xploretv.hr/")
          zeige("https://cdn.a1xploretv.hr/cdn_publish/")
          zeige("https://cdn.a1xploretv.hr/cdn_publish/epg/")

          # 5) Haeufige API-Subdomain-Muster anderer kroatischer/regionaler
          #    Telko-Plattformen (a1.hr generell, gleiche Firmengruppe)
          for host in [
              "https://api.a1xploretv.hr/",
              "https://api.a1.hr/",
              "https://xploretv.a1.hr/",
              "https://www.a1.hr/xplore",
          ]:
              zeige(host)
          EOF

      - name: Hinweis
        run: |
          echo "Rein diagnostischer Lauf - keine Dateien werden veraendert/committet."
