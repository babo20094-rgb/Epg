name: Quellen-Recherche (temporär)

on:
  workflow_dispatch:

jobs:
  recherche:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhaengigkeiten installieren
        run: pip install requests beautifulsoup4

      - name: Erreichbarkeit + echte Daten testen
        run: |
          python3 - <<'PYEOF'
          import requests

          HEADERS = {
              "User-Agent": (
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                  "(KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
              )
          }

          def test(name, url, **kwargs):
              print(f"\n=== {name} ===")
              try:
                  r = requests.get(url, headers=HEADERS, timeout=25, **kwargs)
                  print(f"Status: {r.status_code}, Groesse: {len(r.content)} Bytes")
                  print(f"Auszug: {r.text[:500]!r}")
              except Exception as e:
                  print(f"FEHLER: {e}")

          # Mazedonien: MaxTV GO / Spectar-Backend (in der Sandbox blockiert)
          test(
              "Spectar MK Kanalliste",
              "https://prd-static-mkt.spectar.tv/channel/all/application_id/deep_blue/"
              "device_configuration/2/instance_id/1/language/mk/http_proto/https/format/json",
          )

          # DE-Kaskade: PlutoTV (in der Sandbox 403 bei github.com selbst)
          test("PlutoTV DE XMLTV", "https://i.mjh.nz/PlutoTV/de.xml.gz")

          # DE-Kaskade: Samsung TV Plus (in der Sandbox 404)
          test(
              "SamsungTV DE XMLTV",
              "https://kodi-unlimited-support.de/iptv/epg/samsungtv_de_guide.xml.gz",
          )

          # Weitere mazedonische TV-Guide-Seiten (in der Sandbox proxy-blockiert)
          for name, url in [
              ("mkbox.mk", "https://mkbox.mk"),
              ("programa.mk", "https://programa.mk"),
              ("tv-programa.mk", "https://www.tv-programa.mk"),
              ("epg.mk", "https://epg.mk"),
              ("tv.mk", "https://tv.mk"),
          ]:
              test(name, url)
          PYEOF
