name: Diagnose Laufzeit/Worker-Skalierung (temporaer)

on:
  workflow_dispatch:
    inputs:
      stichprobe:
        description: "Anzahl Sender pro Land/Praefix-Stichprobe (BA/RS/HR/SI/DE/SKY/TVPASSPORT)"
        required: false
        default: "200"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten installieren
        run: pip install -r requirements.txt

      - name: Alle Kaskaden einzeln testen (schreibt/committet NICHTS)
        run: python3 .github/workflows/_diagnose_tmp/laufzeit_test.py "${{ inputs.stichprobe }}"
