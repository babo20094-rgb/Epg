name: Diagnose Kanal-IDs

# Reines Diagnose-Werkzeug, nur manuell startbar. Aendert nichts am Repo,
# erzeugt keine EPG-Datei und startet NICHT den Workflow "Update EPG".
# Vergleicht die veroeffentlichte Epg_365_Tage.xml.gz mit der Playlist
# (Secret PROVIDER) und zeigt das Ergebnis in der Job-Zusammenfassung.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Diagnose ausfuehren
        env:
          PROVIDER: ${{ secrets.PROVIDER }}
        run: python3 diagnose_ids.py Epg_365_Tage.xml.gz
