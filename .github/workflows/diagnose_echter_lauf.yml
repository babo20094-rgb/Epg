name: Diagnose Echter Lauf mit erhoehten Workern (temporaer)

# Fuehrt generate_epg.py GENAU SO aus wie der echte "Update EPG"-Workflow
# (echte Nebenlaeufigkeit: Sky/TVPassport/DE-Kaskade im Hintergrund-Pool
# parallel zur sequenziellen Laender-Kaskade, exakt derselbe Code) - der
# einzige Unterschied sind die EPG_TEST_*-Umgebungsvariablen, die einzelne
# Worker-Konstanten probeweise anheben (siehe generate_epg.py). KEIN
# Commit-Schritt - die erzeugten Epg_365_Tage.xml(.gz)-Dateien bleiben nur
# auf dem voruebergehenden Runner liegen und werden mit dessen Ende
# verworfen, es wird nichts nach main gepusht.

on:
  workflow_dispatch:
    inputs:
      telemach_sky_worker:
        description: "Testweiser Wert fuer PARALLEL_WORKER (u.a. Telemach/Sky/mts.rs/...), Produktionswert 12"
        required: false
        default: "20"
      mtel_worker:
        description: "Testweiser Wert fuer ERHOEHTE_QUELLE_WORKER (mtel.ba), Produktionswert 16"
        required: false
        default: "24"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Unit-Tests
        run: python -m pytest test_generate_epg.py -v

      - name: EPG generieren (echter Code, erhoehte Worker, KEIN Commit)
        env:
          PROVIDER: ${{ secrets.PROVIDER }}
          EPG_TEST_PARALLEL_WORKER: ${{ inputs.telemach_sky_worker }}
          EPG_TEST_ERHOEHTE_QUELLE_WORKER: ${{ inputs.mtel_worker }}
        run: python generate_epg.py
