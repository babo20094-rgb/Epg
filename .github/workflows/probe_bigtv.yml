name: Probe bigtv.rs

# Einmaliger Test (nur manuell): prueft, ob bigtv.rs/epg vom GitHub-Runner
# erreichbar ist und wie die Programmdaten geladen werden (API-Adresse).
# Schreibt nur ins Log, committet nichts. Nach dem Test wieder loeschen.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Seite und Skripte untersuchen
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          mkdir -p probe && cd probe
          echo "=== 1) Seite /epg ==="
          curl -sS -m 30 -L -A "$UA" -H "Accept-Language: sr,en;q=0.8" https://bigtv.rs/epg -o epg.html -w "HTTP %{http_code}, %{size_download} Bytes, %{content_type}\n" || true
          head -c 600 epg.html; echo
          echo "=== 2) Startseite ==="
          curl -sS -m 30 -L -A "$UA" https://bigtv.rs/ -o index.html -w "HTTP %{http_code}, %{size_download} Bytes\n" || true
          for f in epg.html index.html; do
            echo "=== Skripte und Adressen in $f ==="
            grep -o -i '<script[^>]*src="[^"]*"' "$f" | head -20
            grep -o -i '\(https\?:\)\?//[A-Za-z0-9./_?=&%-]*\(api\|epg\|schedule\|program\)[A-Za-z0-9./_?=&%-]*' "$f" | sort -u | head -30
            grep -o -i '"/[A-Za-z0-9./_-]*\(api\|epg\|schedule\)[A-Za-z0-9./_?=&%-]*"' "$f" | sort -u | head -30
          done
          echo "=== 3) Skript-Dateien nach Endpunkten durchsuchen ==="
          for src in $(cat epg.html index.html | grep -o -i 'src="[^"]*\.js[^"]*"' | sed 's/src="//;s/"$//' | sort -u | head -15); do
            case "$src" in
              http*) url="$src" ;;
              //*) url="https:$src" ;;
              /*) url="https://bigtv.rs$src" ;;
              *) url="https://bigtv.rs/$src" ;;
            esac
            echo "--- $url"
            curl -sS -m 30 -L -A "$UA" "$url" -o s.js -w "HTTP %{http_code}, %{size_download} Bytes\n" || continue
            grep -o -i '[A-Za-z0-9:./_-]*\(/api/\|schedule\|/epg\)[A-Za-z0-9./_?=&%${}-]*' s.js | sort -u | head -20
          done
          echo "=== 4) Typische API-Adressen raten ==="
          for u in \
            "https://bigtv.rs/api/epg" \
            "https://bigtv.rs/api/epg?channel=Crime%20Investigation%20Network" \
            "https://bigtv.rs/api/schedule" \
            "https://bigtv.rs/api/channels" \
            "https://bigtv.rs/epg.json" \
            "https://bigtv.rs/api/v1/epg" ; do
            echo "--- $u"
            curl -sS -m 20 -A "$UA" -H "Accept: application/json" "$u" -w "\nHTTP %{http_code}, %{size_download} Bytes\n" | head -c 500 || true
          done
